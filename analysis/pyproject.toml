[project]
name = "fpl-analysis"
version = "0.1.0"
description = "Batch analysis job: fetches FPL data and produces transfer-suggestion snapshots"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.12",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_analysis"]
